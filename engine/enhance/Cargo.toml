[package]
name = "enhance"
description = "Mode Amélioration : redressement des pages scannées (orientation, inclinaison), réglages sérialisables, encodage de l'image améliorée."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ocr.workspace = true
scan.workspace = true
# Réglages sérialisables (déjà présents dans l'application, par UniFFI).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Encodage JPEG de l'image redressée (cf. docs/DEPENDANCES.md).
jpeg-encoder = "0.7"
thiserror.workspace = true

[lints]
workspace = true
