[workspace]
resolver = "2"
members = [
    "pdf_core",
    "edit",
    "render",
    "ffi",
    "uniffi-bindgen",
    "tools/render_bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace.dependencies]
pdf_core = { path = "pdf_core" }
edit = { path = "edit" }
render = { path = "render" }
# MuPDF : rendu, extraction et écriture PDF (licence AGPL-3.0, cf. docs/DEPENDANCES.md).
# Les formats non PDF (EPUB, XPS, HTML…) et le moteur JavaScript sont désactivés.
mupdf = { version = "0.8", default-features = false, features = ["base14-fonts", "system-fonts"] }
thiserror = "2"
unicode-normalization = "0.1"
uniffi = "0.32"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 4
debug = "line-tables-only"
